name: Build program PDF

on:
  workflow_dispatch:
    inputs:
      json_file:
        description: JSON file used to build the program
        required: true
        type: string
      year:
        description: Four-digit year used in the program and PDF titles
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install fonts and browser libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fonts-noto-cjk \
            fonts-urw-base35 \
            libgbm1
          fc-cache -f -v

      - name: Check installed fonts
        run: |
          fc-match "Noto Sans CJK JP"
          fc-match "Nimbus Roman"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Generate HTML and CSS
        env:
          INPUT_JSON: ${{ inputs.json_file }}
          PASJ_YEAR: ${{ inputs.year }}
        run: |
          python3 build_program.py --input "$INPUT_JSON" --year "$PASJ_YEAR"
          python3 build_author_index.py --input "$INPUT_JSON"

      - name: Build PDF
        env:
          PASJ_YEAR: ${{ inputs.year }}
        run: npx vivliostyle build

      - name: Upload PDF
        uses: actions/upload-artifact@v7
        with:
          name: pasj-pdfs
          path: |
            dist/program.pdf
            dist/author_index.pdf
          if-no-files-found: error
